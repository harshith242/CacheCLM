# CacheCLM settings for the planned full run (see README.md).
data_dir: data/memoryagentbench
cache_dir: cache/llm
budget_file: cache/spend.json
prices: configs/prices.yaml
runs_dir: runs
results_dir: results
budget_usd: 5.0
context_budget: 32000       # tokens, as in the paper
chunk_tokens: 4000
temperature: 0.3
repeats: [0]                # 1 repeat to stay under the $5 cap (decided after the first smoke run)
max_edits_per_chunk: 3
max_condense_tries: 3
edit_max_tokens: 16384          # the paper's value; a safety valve, not part of the method; prompt A states it as ~12,000 words
summary_at: 0.75
keep_recent_chunks: 2
summary_words: 1500         # ~2K tokens; the 3,000-word target still hit the cap in smoke 2
summary_max_tokens: 5000
nudges: [0.25, 0.5, 0.75]
query_workers: 8
agent:
  model: deepseek-flash
  base_url: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  options: {extra_body: {thinking: {type: disabled}}}
# The 5 EventQA books at ~70K tokens (the spec's fallback, chosen after the first smoke run projected ~$9 for the
# ~140K versions) and both FactConsolidation 64K sets.
samples:
  - {split: Accurate_Retrieval, row: 7}
  - {split: Accurate_Retrieval, row: 8}
  - {split: Accurate_Retrieval, row: 9}
  - {split: Accurate_Retrieval, row: 10}
  - {split: Accurate_Retrieval, row: 11}
  - {split: Conflict_Resolution, row: 2}
  - {split: Conflict_Resolution, row: 6}
# A second repeat of the FactConsolidation unit (rows 6 and 2 share one text) to measure run-to-run noise.
extra_runs:
  - {split: Conflict_Resolution, row: 6, repeat: 1}
  - {split: Conflict_Resolution, row: 2, repeat: 1}
# Smoke runs use data that is not evaluated. FactConsolidation mh_32k (row 1) gets a 16K budget so editing is needed (12K left
# no room to keep a summary), and all 100 questions for a realistic turns_left. EventQA uses eventqa_full text beyond rows 7-11.
smoke:
  samples:
    - {split: Conflict_Resolution, row: 1, questions: 100, context_budget: 16000}
    - {split: Accurate_Retrieval, row: 2, start: 285000, end: 570000, questions: 5}
  runs_dir: runs_smoke
  results_dir: results_smoke
